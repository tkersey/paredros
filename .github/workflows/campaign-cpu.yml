name: Measure native comparison execution and publication time
on:
  push:
    branches: [diagnostic/campaign-cpu]
permissions:
  contents: read
  actions: read
jobs:
  phases:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - name: Install coarse function timer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bpftrace
      - name: Time the original direct x86-64 comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=$(mktemp -d /tmp/phases.XXXX)
          cd "$work"
          gh api repos/tkersey/paredros/actions/artifacts/14373798093/zip > input.zip
          echo '7b4aefb2a75179d06ff864e865e603f0ff07df72f3c71f974393dac853cfbe2f  input.zip' | sha256sum --check --strict
          unzip -p input.zip methods.tar.gz | tar -xzf -
          program="$work/test-tools/native/methods"
          sha256sum "$program"
          nm --defined-only --format=posix "$program" | cut -d' ' -f1 > symbols
          for label in advance begin pump drive root publish; do
            case "$label" in
              advance) pattern='^session\.Session\(tests\.experiment\.Types\)\.advance$' ;;
              begin) pattern='^driver\.Driver\.beginAdvance$' ;;
              pump) pattern='^driver\.Driver\.pump$' ;;
              drive) pattern='^driver\.Driver\.drive$' ;;
              root) pattern='^tasks\.root_execution\..*tests\.experiment\.Types.*\.pumpRoot$' ;;
              publish) pattern='^tasks\.root_execution\..*tests\.experiment\.Types.*\.publishRootCut$' ;;
            esac
            symbol=$(grep -Ex "$pattern" symbols)
            test "$(wc -l <<< "$symbol")" -eq 1
            cat >> phases.bt <<PROBE
          uprobe:$program:"$symbol" { @start_${label}[tid] = nsecs; }
          uretprobe:$program:"$symbol" /@start_${label}[tid]/ {
            @micros["$label"] = sum((nsecs - @start_${label}[tid]) / 1000);
            @calls["$label"] = count();
            delete(@start_${label}[tid]);
          }
          PROBE
          done
          echo 'interval:s:1 /!@armed/ { @armed = 1; printf("ready\n"); } interval:s:30 { time("%H:%M:%S\n"); print(@micros); print(@calls); }' >> phases.bt
          sudo bpftrace -B line phases.bt > timings 2>&1 &
          observer=$!
          trap 'sudo kill -INT "$observer" 2>/dev/null || true; cat timings' EXIT
          for _ in {1..40}; do
            if grep -Fxq ready timings; then break; fi
            kill -0 "$observer"
            sleep 1
          done
          grep -Fxq ready timings
          rc=0
          timeout -k 3 240 uv run --no-project --isolated python "$GITHUB_WORKSPACE/.github/measure-native-case.py" "$program" 21 'native experiment compares all cases and retains unknown cost through interruption' || rc=$?
          echo "Sample ended with runner status $rc"
          test "$rc" -eq 0 || test "$rc" -eq 124
          grep -Eq '@micros\[pump\]: [1-9]' timings
