name: Time independent groups of the retained Linux executables
on:
  push:
    branches: [diagnostic/native-inventory-timing]
permissions:
  contents: read
  actions: read
jobs:
  inventories:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      groups: ${{ steps.groups.outputs.matrix }}
    steps:
      -
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: groups
        run: |
          matrix=$(node .github/native-execution.mjs | jq -c '{include:[.include[] | select(.name == "transitions-second-delivery" or .name == "transitions-second-retry")]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  measure:
    needs: inventories
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    name: Retained / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventories.outputs.groups) }}
    steps:
      - name: Authenticate the binary and runner
        env:
          GH_TOKEN: ${{ github.token }}
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          test "$PART" = transitions-second
          id=14389476326
          digest=4e2ad183eb52e6e63c9405431555967a427bcd612fc3739acac7a47b099ea6eb
          gh api "repos/tkersey/paredros/actions/artifacts/$id/zip" > input.zip
          echo "$digest  input.zip" | sha256sum --check --strict
          unzip -p input.zip "$PART.tar.gz" | tar -xzf -
          echo '4da9c954c6879fc6d46a94a627dd23dc7d0b7f6a251199118db8e1e2172d3c38  test-tools/native/qualification_tests.mjs' | sha256sum --check --strict
      - name: Run the selected group and check its complete inventory
        env:
          PART: ${{ matrix.part }}
          FILTERS: ${{ toJSON(matrix.filters) }}
          INDEX: ${{ matrix.index }}
          COUNT: ${{ matrix.count }}
          INVENTORY: ${{ matrix.inventory }}
        run: |
          set -euo pipefail
          /usr/bin/time -f 'seconds=%e rss_KiB=%M' node test-tools/native/qualification_tests.mjs "./test-tools/native/$PART" "$FILTERS" "[$INDEX]" | tee result.log
          grep -Fxq "$COUNT/$COUNT tests passed across 1 independent groups ($INVENTORY tests in complete inventory)." result.log
