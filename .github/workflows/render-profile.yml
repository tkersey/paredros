name: Verify the self-hosted source suite with authenticated modes
on:
  push:
    branches: [diagnostic/render-cost-f493826]
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      ZIG_DEBUG_CMD: '1'
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - name: Restore authenticated Linux build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tkersey/paredros/actions/artifacts/14284596529/zip > preparation.zip
          echo '95883329f2fd4be097725e0c5b2c7501ed21b0025bd331c1da9071ff45c5f400  preparation.zip' | sha256sum --check --strict
          unzip -p preparation.zip preparation.tar.zst | zstd -dc | tar -xpf -
      - name: Select self-hosted code generation for the upstream build hash
        run: |
          f=zig-pkg/protean-9.1.0-dBg3hJ0qeAB3WK_48LtG5H-BtfXoTVNR3UGDbG7yINLP/build_protean.zig
          test "$(sed -n '/const build_hash = s.b.addLibrary/,/s.host_tool.root_module.linkLibrary/p' "$f" | grep -Fc '.use_llvm = true')" = 1
          sed -i '/const build_hash = s.b.addLibrary/,/s.host_tool.root_module.linkLibrary/s/\.use_llvm = true/.use_llvm = false/' "$f"
      - name: Run the source suite with the PAREDROS build graph
        run: zig build test -Dnative=false -Doptimize=safe --verbose --summary all
