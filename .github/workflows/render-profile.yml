name: Measure checked campaign rendering on native Linux
on:
  push:
    branches: [diagnostic/campaign-rendering]
permissions:
  contents: read
  actions: read
env:
  ZIG_DEBUG_CMD: '1'
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: candidate, suite: methods}
          - {variant: candidate, suite: rendering}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      -
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      -
        name: Restore authenticated Linux build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tkersey/paredros/actions/artifacts/14374131920/zip > preparation.zip
          echo '394ed18da33bbad88976d1dfca9d4f5f543fbfabec8c1541ec72b98cd6ed93f6  preparation.zip' | sha256sum --check --strict
          unzip -p preparation.zip preparation.tar.zst | zstd -dc | tar -xpf -
      -
        name: Install the native musl C compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Compile the selected existing suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          zig build build-native-tests -Dnative-tests=true -Dnative-group="$SUITE" -Dtest-product-assets=false -Dtarget=x86_64-linux-musl -Doptimize=safe -j2 --summary all
          cp zig-out/test-tools/native/"$SUITE" check
          sha256sum check
          tar -czf check.tar.gz check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.variant }}-${{ matrix.suite }}
          path: check.tar.gz
          compression-level: 0
          retention-days: 1
  execute:
    needs: compile
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: candidate, suite: methods, case: campaign}
          - {variant: candidate, suite: rendering, case: native render frame empty evidence and invalid coverage remain explicit}
          - {variant: candidate, suite: rendering, case: native render frame safely abbreviates one huge Unicode commit and keeps coverage}
          - {variant: candidate, suite: rendering, case: native render frame budgets hostile escaping and all sections at their upper bounds}
          - {variant: candidate, suite: rendering, case: native render frame keeps Unicode mentions and URLs inert and flattens text controls}
    steps:
      - *checkout
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.variant }}-${{ matrix.suite }}
      - name: Execute the unchanged native test
        env:
          CASE: ${{ matrix.case }}
        run: |
          tar -xzf check.tar.gz
          if [ "$CASE" = campaign ]; then
            uv run --no-project --isolated python .github/observe-campaign.py ./check
          else
            uv run --no-project --isolated python .github/measure-native-case.py ./check 63 "$CASE"
          fi
