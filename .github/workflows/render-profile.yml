name: Measure short-circuit settlement on native Linux
on:
  push:
    branches: [diagnostic/settlement-cost]
permissions:
  contents: read
  actions: read
env:
  ZIG_DEBUG_CMD: '1'
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      -
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      -
        name: Restore authenticated Linux build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tkersey/paredros/actions/artifacts/14374131920/zip > preparation.zip
          echo '394ed18da33bbad88976d1dfca9d4f5f543fbfabec8c1541ec72b98cd6ed93f6  preparation.zip' | sha256sum --check --strict
          unzip -p preparation.zip preparation.tar.zst | zstd -dc | tar -xpf -
      -
        name: Install the native musl C compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Compile the selected existing suite
        run: |
          zig build build-native-tests -Dnative-tests=true -Dnative-group=transitions -Dnative-partition=second -Dtest-product-assets=false -Dtarget=x86_64-linux-musl -Doptimize=safe -j2 --summary all
          cp zig-out/test-tools/native/transitions-second check
          sha256sum check
          tar -czf check.tar.gz check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate
          path: check.tar.gz
          compression-level: 0
          retention-days: 1
  execute:
    needs: compile
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [prior, candidate]
        case:
          - native settlements retain unrelated superseded malformed or unproven delivery evidence
          - native settlements advance only exact contiguous confirmed coverage and retain receipt
    steps:
      - *checkout
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - if: matrix.part == 'candidate'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.part }}
      - name: Verify previously built control executable
        if: matrix.part == 'prior'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tkersey/paredros/actions/artifacts/14380597702/zip > input.zip
          echo '8fb3a525685d75f2952f52e77eec7dca9a947aaadb6120b63fc8bbfa791b8744  input.zip' | sha256sum --check --strict
          unzip -q input.zip check.tar.gz
      - name: Execute the original native case
        env:
          CASE: ${{ matrix.case }}
        run: |
          tar -xzf check.tar.gz
          (
            while sleep 45; do
              for db in .zig-cache/tmp/*/native/state.sqlite; do
                if [ -f "$db" ]; then
                  sqlite3 -readonly -cmd '.timeout 250' "$db" 'select count(*),sum(terminal) from tasks;' || true
                fi
              done
            done
          ) &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true' EXIT
          uv run --no-project --isolated python .github/measure-native-case.py ./check 25 "$CASE"
