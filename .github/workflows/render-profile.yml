name: Measure independent cases from the retained native Linux executables
on:
  push:
    branches: [diagnostic/render-cost-f493826]
permissions:
  contents: read
  actions: read
jobs:
  measure:
    name: Measure / ${{ matrix.case }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: authority, count: 95, artifact: 14374167715, digest: a733e51516326e37e871404c8b0f09f36c31dd14be0869ed75d1912afeaf7ad1, case: control proposal consumer shows and confirms maximal retained body by authored zero ordinal}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - name: Run the selected original case with Zig's standard test server
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
          SHA256: ${{ matrix.digest }}
          PART: ${{ matrix.part }}
          CASE: ${{ matrix.case }}
          COUNT: ${{ matrix.count }}
        run: |
          gh api "repos/tkersey/paredros/actions/artifacts/$ARTIFACT/zip" > binary.zip
          echo "$SHA256  binary.zip" | sha256sum --check --strict
          unzip -p binary.zip "$PART.tar.gz" | tar -xzf -
          uv run --no-project --isolated python .github/measure-native-case.py "./test-tools/native/$PART" "$COUNT" "$CASE"
  clock:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - name: Observe durable campaign progress in the optimized Linux runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tkersey/paredros/actions/artifacts/14376321918/zip > binary.zip
          echo 'c9df3e982e2325808e626677861832e0baacea27cb442adcc8e37b87a3eb82ab  binary.zip' | sha256sum --check --strict
          unzip -p binary.zip methods.tar.gz | tar -xzf -
          lscpu | sed -n '/^Model name:/p'
          uv run --no-project --isolated python .github/observe-experiment-clock.py ./methods
