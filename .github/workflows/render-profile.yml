name: Measure progress through the native retained-method comparison
on:
  push:
    branches: [diagnostic/render-cost-f493826]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - name: Restore authenticated Linux build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tkersey/paredros/actions/artifacts/14284596529/zip > preparation.zip
          echo '95883329f2fd4be097725e0c5b2c7501ed21b0025bd331c1da9071ff45c5f400  preparation.zip' | sha256sum --check --strict
          unzip -p preparation.zip preparation.tar.zst | zstd -dc | tar -xf -
      - name: Compile the focused test with the self-hosted backend
        env:
          WITNESS: native experiment compares all cases and retains unknown cost through interruption
        run: |
          zig test -fno-llvm -fstrip -Osafe -target x86_64-linux-musl -mcpu baseline --dep application_types --dep protean_native --dep protean_contracts --dep protean --dep horos -Mroot=native_methods_test.zig -Osafe -target x86_64-linux-musl -mcpu baseline --dep protean --dep protean_contracts -Mapplication_types=app/types.zig .zig-cache/o/15fcb669fcdc96cd2e2be147fe060c77/libprotean-native-c.a -fstrip -Osafe -target x86_64-linux-musl -mcpu baseline -I .zig-cache/o/31862b6f660dd84890962575457bffc9 --dep kosmos --dep horos_data --dep protean_contracts --dep horos --dep protean --dep _native_dependency_admission --dep native_c --dep native_options -Mprotean_native=zig-pkg/protean-9.1.0-dBg3hJ0qeAB3WK_48LtG5H-BtfXoTVNR3UGDbG7yINLP/runtime/native/root.zig -Osafe -target x86_64-linux-musl -mcpu baseline --dep horos_data -Mprotean_contracts=zig-pkg/protean-9.1.0-dBg3hJ0qeAB3WK_48LtG5H-BtfXoTVNR3UGDbG7yINLP/src/contracts.zig -Osafe -target x86_64-linux-musl -mcpu baseline --dep horos --dep horos_data --dep protean_contracts -Mprotean=zig-pkg/protean-9.1.0-dBg3hJ0qeAB3WK_48LtG5H-BtfXoTVNR3UGDbG7yINLP/src/protean.zig -Osafe -target x86_64-linux-musl -mcpu baseline --dep horos_data -Mhoros=zig-pkg/horos-8.0.1-flclaJaVVgC6MoQyrPCu39bQWT4ffTRnDxam33dMB2hI/src/root.zig -Osafe -target x86_64-linux-musl -mcpu baseline --dep horos_data --dep horos --dep packaged_runtime -Mkosmos=.protean-native/inputs/kosmos/src/root.zig -Osafe -target x86_64-linux-musl -mcpu baseline -Mhoros_data=zig-pkg/horos-8.0.1-flclaJaVVgC6MoQyrPCu39bQWT4ffTRnDxam33dMB2hI/src/data/root.zig -M_native_dependency_admission=.zig-cache/o/a05536e176de12acf3398b34b179c597/native_dependency_admission.zig -Osafe -target x86_64-linux-musl -mcpu baseline -Mnative_c=.zig-cache/o/c1774b413f703d637f992daf9e513a37/native_c.zig -Mnative_options=.zig-cache/o/358b8ae923fbc2f6fdc6b74bcb23b219/options.zig -Osafe -target x86_64-linux-musl -mcpu baseline -Mpackaged_runtime=.zig-cache/o/7f17a83969290ee174dc1066eb4111eb/runtime.zig -lc --cache-dir .zig-cache --global-cache-dir .zig-cache --build-root . --name test --zig-lib-dir /opt/hostedtoolcache/zig/0.17.1/x64/lib/ --test-no-exec -femit-bin=experiment-case --test-filter "$WITNESS"
      - name: Record comparison progress for up to seven minutes
        run: |
          set -o pipefail
          set +e
          /usr/bin/time -v timeout 420 ./experiment-case 2>&1 | tee measured.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 124 ]; then
            echo 'Measurement window elapsed with comparison incomplete'
            grep -Fq 'experiment codec prepare' measured.log
          else
            test "$code" -eq 0
            grep -Fxq 'All 2 tests passed.' measured.log
          fi
