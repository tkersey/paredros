name: Measure proposal text span processing on native Linux
on:
  push:
    branches: [diagnostic/proposal-spans]
permissions:
  contents: read
  actions: read
env:
  ZIG_DEBUG_CMD: '1'
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      -
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      -
        name: Restore authenticated Linux build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tkersey/paredros/actions/artifacts/14374131920/zip > preparation.zip
          echo '394ed18da33bbad88976d1dfca9d4f5f543fbfabec8c1541ec72b98cd6ed93f6  preparation.zip' | sha256sum --check --strict
          unzip -p preparation.zip preparation.tar.zst | zstd -dc | tar -xpf -
      -
        name: Install the native musl C compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Compile the selected existing suite
        run: |
          zig build build-native-tests -Dnative-tests=true -Dnative-group=rendering -Dtest-product-assets=false -Dtarget=x86_64-linux-musl -Doptimize=safe -j2 --summary all
          cp zig-out/test-tools/native/rendering check
          sha256sum check
          tar -czf check.tar.gz check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate
          path: check.tar.gz
          compression-level: 0
          retention-days: 1
  execute:
    needs: compile
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [candidate]
        case:
          - native conversation retains full multibyte descriptions within the scalar budget
          - native conversation describes exact hostile Unicode fields and binds attempt aware buttons
          - native conversation retains maximal exact proposal body for CLI without a Slack button
          - native conversation turn binds distinct proposals and freezes model context
          - native conversation final failure and absent configuration cannot invoke the model
          - native conversation refuses an invalid confirmation without invoking a configured model
        include:
          - part: prior
            case: native conversation turn binds distinct proposals and freezes model context
    steps:
      - *checkout
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - if: matrix.part == 'candidate'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.part }}
      - name: Verify previously built control executable
        if: matrix.part == 'prior'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tkersey/paredros/actions/artifacts/14374282865/zip > input.zip
          echo 'e6ec6d53fa5c08f16c7ed91b2283fae5169a6ab2c8a98a8aafea99687dc23ba0  input.zip' | sha256sum --check --strict
          unzip -p input.zip rendering.tar.gz | tar -xzf -
          cp test-tools/native/rendering check
      - name: Execute the original native case
        env:
          CASE: ${{ matrix.case }}
        run: |
          if [ -f check.tar.gz ]; then tar -xzf check.tar.gz; fi
          uv run --no-project --isolated python .github/measure-native-case.py ./check 63 "$CASE"
