name: Run the Linux GCC rendering case with the pinned musl statx implementation
on:
  push:
    branches: [diagnostic/render-cost-f493826]
permissions:
  contents: read
  actions: read
env:
  ZIG_DEBUG_CMD: '1'
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
jobs:
  measure:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - name: Restore identical source and native archive from the matched comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tkersey/paredros/actions/artifacts/14372576096/zip > inputs.zip
          echo '740b4545c8dd2792cd18650d60e953ec5e056a9a1f3f9af046e05e9002ed4039  inputs.zip' | sha256sum --check --strict
          unzip -p inputs.zip comparison.tar.zst | zstd -dc | tar -xpf -
      - name: Link the pinned musl statx and execute the same checked case
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          flags=(-std=gnu17 -fno-strict-aliasing -fno-ipa-modref -Wno-builtin-declaration-mismatch -fmax-errors=8 -march=x86-64 -mtune=generic -I.)
          ziglib=$(dirname "$(realpath "$(command -v zig)")")/lib
          musl="$ziglib/libc/musl"
          musl-gcc -std=c99 -O2 -I"$musl/arch/x86_64" -I"$musl/arch/generic" -I"$musl/src/include" -I"$musl/src/internal" -I"$ziglib/libc/include/x86_64-linux-musl" -I"$ziglib/libc/include/generic-musl" -c "$musl/src/linux/statx.c" -o statx.o
          printf '%s\n' 'int main(void) { return 0; }' | musl-gcc -static -x c - -x none statx.o -o check-statx
          ./check-statx
          musl-gcc "${flags[@]}" -O2 -fno-builtin -c compiler-rt.c -o compiler-rt.o
          ar rcs libzig-rt.a compiler-rt.o
          musl-gcc "${flags[@]}" -O1 -c render.c -o render.o
          aliases=()
          while read -r name; do aliases+=("-Wl,--undefined=$name,--defsym=protean_posix_$name=$name"); done < aliases
          musl-gcc -static render.o statx.o libprotean-native-c.a libzig-rt.a "${aliases[@]}" -lm -lpthread -o gcc
          set -o pipefail
          /usr/bin/time -f 'elapsed=%e rss=%M' ./gcc 2>&1 | tee observed.log
          grep -Fxq 'All 2 tests passed.' observed.log
