name: Verify the downstream native build graph on Linux
on:
  push:
    branches: [diagnostic/render-cost-f493826]
permissions:
  contents: read
  actions: read
jobs:
  continuity:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      ZIG_DEBUG_CMD: '1'
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - name: Restore authenticated Linux build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tkersey/paredros/actions/artifacts/14284596529/zip > preparation.zip
          echo '95883329f2fd4be097725e0c5b2c7501ed21b0025bd331c1da9071ff45c5f400  preparation.zip' | sha256sum --check --strict
          unzip -p preparation.zip preparation.tar.zst | zstd -dc | tar -xpf -
      - name: Exercise the downstream build graph with the candidate Protean changes
        env:
          WITNESS: native genesis retains exact fresh head and rejects invalid inputs across restart
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          cp -a zig-pkg/protean-9.1.0-dBg3hJ0qeAB3WK_48LtG5H-BtfXoTVNR3UGDbG7yINLP diagnostic-protean
          git apply --unidiff-zero --directory=diagnostic-protean .github/protean-build.patch
          zig build test-native -Dnative-tests=true -Dnative-group=continuity -Dtest-product-assets=false -Dtest-filter="$WITNESS" -Dtarget=x86_64-linux-musl -Doptimize=safe -j2 --verbose --summary all 2>&1 | tee observed.log
          grep -Eq '2/2 tests passed|2 tests passed' observed.log
