name: Measure independent cases from the retained native Linux executables
on:
  push:
    branches: [diagnostic/render-cost-f493826]
permissions:
  contents: read
  actions: read
jobs:
  measure:
    name: Measure / ${{ matrix.case }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: authority, count: 95, artifact: 14374167715, digest: a733e51516326e37e871404c8b0f09f36c31dd14be0869ed75d1912afeaf7ad1, case: native public session serves two control clients while a worker is held}
          - {part: authority, count: 95, artifact: 14374167715, digest: a733e51516326e37e871404c8b0f09f36c31dd14be0869ed75d1912afeaf7ad1, case: native conversation retains maximal exact proposal body for CLI without a Slack button}
          - {part: rendering, count: 63, artifact: 14374282865, digest: e6ec6d53fa5c08f16c7ed91b2283fae5169a6ab2c8a98a8aafea99687dc23ba0, case: native render frame budgets hostile escaping and all sections at their upper bounds}
          - {part: transitions-second, count: 25, artifact: 14373294716, digest: 2e436cc682d6391402f724bdc6b7c3397cb70599317361ea38e429249aa91658, case: native settlements retain unrelated superseded malformed or unproven delivery evidence}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - name: Run the selected original case with Zig's standard test server
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
          SHA256: ${{ matrix.digest }}
          PART: ${{ matrix.part }}
          CASE: ${{ matrix.case }}
          COUNT: ${{ matrix.count }}
        run: |
          gh api "repos/tkersey/paredros/actions/artifacts/$ARTIFACT/zip" > binary.zip
          echo "$SHA256  binary.zip" | sha256sum --check --strict
          unzip -p binary.zip "$PART.tar.gz" | tar -xzf -
          uv run --no-project --isolated python .github/measure-native-case.py "./test-tools/native/$PART" "$COUNT" "$CASE"
