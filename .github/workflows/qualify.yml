name: Offline qualification
run-name: Essential qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tiger-style:
    name: TigerStyle
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - name: Enforce TigerStyle on all tracked Zig source
        run: bash tools/tiger-style.sh --all HEAD
  qualify:
    name: Qualification / ${{ matrix.lane }} / linux-x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: source
            groups: source,emitted
            budget: 600
          - lane: providers
            groups: providers
            budget: 600
          - lane: simulation-first
            groups: simulation-first
            budget: 600
          - lane: simulation-second
            groups: simulation-second
            budget: 600
          - lane: simulation-third
            groups: simulation-third
            budget: 600
          - lane: simulation-fourth
            groups: simulation-fourth
            budget: 600
          - lane: simulation-fifth
            groups: simulation-fifth
            budget: 600
    env:
      ZIG_DEBUG_CMD: '1'
    steps: &lane-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.9.0'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - name: Qualify ${{ matrix.groups }}
        run: zig build qualify -- --group "${{ matrix.groups }}" --budget-seconds "${{ matrix.budget }}"
  product:
    name: Qualification / ${{ matrix.lane }} / linux-x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - lane: product
            groups: product
            budget: 840
    env:
      ZIG_DEBUG_CMD: '1'
    steps: *lane-steps
  native:
    name: native
    needs: [qualify, tiger-style]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete qualification within ten minutes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          QUALIFICATION: ${{ needs.qualify.result }}
          TIGER_STYLE: ${{ needs.tiger-style.result }}
        run: |
          test "$QUALIFICATION" = success
          test "$TIGER_STYLE" = success
          if [ "$RUN_ATTEMPT" != 1 ]; then
            echo 'Qualification requires the first attempt of its run.'
            exit 1
          fi
          elapsed=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '(now - (.created_at | fromdate)) | floor')
          echo "Gated qualification from trigger through terminal checks: ${elapsed}s (maximum 600s)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -le 600
