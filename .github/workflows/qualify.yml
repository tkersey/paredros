name: Offline qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mac_backup:
        description: Run on the Mac's self-hosted Linux runner
        type: boolean
        default: false
permissions:
  contents: read
env:
  ZIG_DEBUG_CMD: '1'
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_backup && 'mac-backup' || 'ubuntu-22.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - run: zig build test -Dnative=false -Doptimize=safe --summary all
  acquire:
    name: Acquire native inputs
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_backup && 'mac-backup' || 'ubuntu-22.04' }}
    timeout-minutes: 10
    outputs:
      key: ${{ steps.inputs.outputs.acquisition }}
      sha256: ${{ steps.archive.outputs.sha256 }}
      execution: ${{ steps.matrix.outputs.execution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - name: Select execution groups
        id: matrix
        run: |
          execution=$(node .github/native-execution.mjs)
          echo "execution=$execution" >> "$GITHUB_OUTPUT"
      - &identify_inputs
        name: Identify exact native inputs
        id: inputs
        run: |
          compiler_root="$(dirname "$(realpath "$(command -v zig)")")"
          compiler=$(tar -C "$compiler_root" --sort=name --mtime=@0 \
            --owner=0 --group=0 --numeric-owner --dereference -cf - zig lib LICENSE \
            | sha256sum | cut -d' ' -f1)
          COMPILER_SHA256="$compiler" node .github/native-inputs.mjs keys >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .zig-cache
            .protean-native/inputs
          key: ${{ steps.inputs.outputs.acquisition }}
      - name: Acquire and authenticate pinned native inputs
        run: node .github/native-inputs.mjs acquisition
      - name: Seal acquired inputs
        id: archive
        run: |
          tar -cf - .zig-cache zig-pkg .protean-native/inputs \
            | zstd -T2 -1 -o "$RUNNER_TEMP/acquisition.tar.zst"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/acquisition.tar.zst" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: acquisition-${{ steps.inputs.outputs.acquisition }}
          path: ${{ runner.temp }}/acquisition.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  prepare:
    name: Prepare native artifacts
    needs: acquire
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_backup && 'mac-backup' || 'ubuntu-22.04' }}
    timeout-minutes: 10
    outputs:
      key: ${{ steps.inputs.outputs.preparation }}
      sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - *identify_inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: acquisition-${{ steps.inputs.outputs.acquisition }}
          path: ${{ runner.temp }}/acquisition
      - name: Verify acquired inputs
        env:
          ACQUISITION_KEY: ${{ needs.acquire.outputs.key }}
          ACQUISITION_SHA256: ${{ needs.acquire.outputs.sha256 }}
          INPUT_KEY: ${{ steps.inputs.outputs.acquisition }}
        run: |
          test "$ACQUISITION_KEY" = "$INPUT_KEY"
          printf '%s  %s\n' "$ACQUISITION_SHA256" "$RUNNER_TEMP/acquisition/acquisition.tar.zst" | sha256sum --check --strict
          zstd -dc "$RUNNER_TEMP/acquisition/acquisition.tar.zst" | tar -xpf -
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .zig-cache
          key: ${{ steps.inputs.outputs.preparation }}
      - name: Materialize application and native prerequisites
        run: |
          nproc
          free -m
          node -e '
            const {spawnSync} = require("node:child_process");
            setInterval(() => {
              console.log("Compiler sample " + new Date().toISOString());
              spawnSync("ps", ["-C", "zig,maker", "-o", "pid,ppid,etime,time,pcpu,rss,args"], {stdio: "inherit"});
            }, 20000);
          ' &
          observer=$!
          trap 'kill "$observer" 2>/dev/null || true; wait "$observer" 2>/dev/null || true' EXIT
          node .github/native-inputs.mjs preparation
      - name: Seal prepared inputs
        id: archive
        run: |
          cmp app/types.zig zig-out/prepared/types.zig
          printf '%s\n' "${{ steps.inputs.outputs.preparation }}" > zig-out/prepared/inputs.key
          (cd zig-out/prepared && sha256sum program.bpi3 application.json types.zig > SHA256SUMS)
          tar -cf - .zig-cache zig-pkg .protean-native/inputs -C zig-out prepared \
            | zstd -T2 -1 -o "$RUNNER_TEMP/preparation.tar.zst"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/preparation.tar.zst" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preparation-${{ steps.inputs.outputs.preparation }}
          path: ${{ runner.temp }}/preparation.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  build:
    name: Build / ${{ matrix.part }}
    needs: prepare
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_backup && 'mac-backup' || 'ubuntu-22.04' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [authority, providers, transitions-first, transitions-second, transitions-third, rendering, methods, continuity-first, continuity-second, continuity-third, product, crash]
    env:
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - *identify_inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: preparation-${{ steps.inputs.outputs.preparation }}
          path: ${{ runner.temp }}/preparation
      - name: Verify prepared inputs
        env:
          PREPARATION_KEY: ${{ needs.prepare.outputs.key }}
          PREPARATION_SHA256: ${{ needs.prepare.outputs.sha256 }}
          INPUT_KEY: ${{ steps.inputs.outputs.preparation }}
        run: |
          test "$PREPARATION_KEY" = "$INPUT_KEY"
          printf '%s  %s\n' "$PREPARATION_SHA256" "$RUNNER_TEMP/preparation/preparation.tar.zst" | sha256sum --check --strict
          zstd -dc "$RUNNER_TEMP/preparation/preparation.tar.zst" | tar -xpf -
          test "$(cat prepared/inputs.key)" = "$INPUT_KEY"
          (cd prepared && sha256sum --check --strict SHA256SUMS)
          cmp app/types.zig prepared/types.zig
      - name: Compile selected artifact
        run: |
          nproc
          free -m
          node -e '
            const {spawnSync} = require("node:child_process");
            setInterval(() => {
              console.log("Compiler sample " + new Date().toISOString());
              spawnSync("ps", ["-C", "zig,maker", "-o", "pid,ppid,etime,time,pcpu,rss,args"], {stdio: "inherit"});
            }, 20000);
          ' &
          observer=$!
          trap 'kill "$observer" 2>/dev/null || true; wait "$observer" 2>/dev/null || true' EXIT
          case "$PART" in
            product) zig build -Dnative=true -Dtarget=x86_64-linux-musl -Demitted-application=prepared -Doptimize=safe -j2 --verbose --summary all ;;
            crash) zig build build-crash-tests -Dcrash-tests=true -Demitted-application=prepared -Doptimize=safe -j2 --verbose --summary all ;;
            providers|rendering|methods)
              zig build build-native-tests -Dnative-tests=true -Dnative-group="$PART" -Dtest-product-assets=false -Doptimize=safe -j2 --verbose --summary all ;;
            continuity-*)
              zig build build-native-tests -Dnative-tests=true -Dnative-group=continuity -Dnative-partition="${PART##*-}" -Demitted-application=prepared -Doptimize=safe -j2 --verbose --summary all ;;
            transitions-*)
              zig build build-native-tests -Dnative-tests=true -Dnative-group=transitions -Dnative-partition="${PART##*-}" -Dtest-product-assets=false -Doptimize=safe -j2 --verbose --summary all ;;
            *) zig build build-native-tests -Dnative-tests=true -Dnative-group="$PART" -Demitted-application=prepared -Doptimize=safe -j2 --verbose --summary all ;;
          esac
          tar -C zig-out -czf "$RUNNER_TEMP/$PART.tar.gz" .
          sha256sum "$RUNNER_TEMP/$PART.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.part }}
          path: ${{ runner.temp }}/${{ matrix.part }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  execute:
    name: Execute / ${{ matrix.name }}
    needs: [acquire, build]
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_backup && 'mac-backup' || 'ubuntu-22.04' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.acquire.outputs.execution) }}
    env:
      PART: ${{ matrix.part }}
      EXPECTED: ${{ matrix.count }}
      INVENTORY: ${{ matrix.inventory }}
      TEST_FILTERS: ${{ toJSON(matrix.filters) }}
      TEST_INDEX: ${{ matrix.index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.part }}
          path: ${{ runner.temp }}/artifacts
      - if: matrix.part == 'product' || matrix.part == 'crash'
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - name: Execute every selected check
        run: |
          mkdir -p zig-out
          tar -C zig-out -xzf "$RUNNER_TEMP/artifacts/$PART.tar.gz"
          case "$PART" in
            product) uv run --no-project python tests/product_smoke.py zig-out/bin/paredros --report "$RUNNER_TEMP/report.json" ;;
            crash) uv run --no-project python tests/process_crash.py zig-out/test-tools/paredros-crash-tests --report "$RUNNER_TEMP/report.json" ;;
            *)
              set -o pipefail
              if [[ -n "$TEST_INDEX" ]]; then
                node zig-out/test-tools/native/qualification_tests.mjs "zig-out/test-tools/native/$PART" \
                  "$TEST_FILTERS" "[$TEST_INDEX]" 2>&1 | tee "$RUNNER_TEMP/tests.log"
                grep -Fxq "$EXPECTED/$EXPECTED tests passed across 1 independent groups ($INVENTORY tests in complete inventory)." "$RUNNER_TEMP/tests.log"
              else
                zig-out/test-tools/native/"$PART" 2>&1 | tee "$RUNNER_TEMP/tests.log"
                grep -Fxq "All $EXPECTED tests passed." "$RUNNER_TEMP/tests.log"
              fi
              ;;
          esac
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: results-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 7
